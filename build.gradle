plugins {
    id 'fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.1"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.1"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-world:6.1.1"
    modCompileOnly "org.ladysnake.cardinal-components-api:cardinal-components-scoreboard:6.1.1"
    compileOnly "org.jspecify:jspecify:1.0.0"
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:15.0.140") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modCompileOnly "maven.modrinth:simple-voice-chat:fabric-1.21.1-2.6.12"

    // The upstream mod is supplied by the player at runtime. This local jar is only
    // used to compile the extension against the upstream public classes.
    modCompileOnly files('libs/starrailexpress.jar')
    modCompileOnly fileTree(dir: 'libs', include: '*.jar', exclude: ['starrailexpress.jar', 'sre-lib-1.0.3.jar'])
}

loom {
    accessWidenerPath = file('src/main/resources/ricord_rail_express.accesswidener')
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

jar {
    from('LICENSE.txt') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
